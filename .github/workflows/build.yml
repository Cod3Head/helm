name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-standalone:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libasound2-dev libfreetype6-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev \
            mesa-common-dev libgl1-mesa-dev libcurl4-openssl-dev libjack-jackd2-dev
      - name: Build standalone
        shell: bash
        run: make standalone CONFIG=Release 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: build.log
      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: helm-linux-standalone
          path: standalone/builds/linux/build/helm
          if-no-files-found: warn

  windows-standalone:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Build standalone (Visual Studio 2022 project)
        shell: pwsh
        run: |
          msbuild standalone/builds/vs17/Helm.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal 2>&1 | Tee-Object -FilePath build.log
      - name: Report compiler errors as annotations
        if: failure()
        shell: pwsh
        run: |
          $errors = Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]+[0-9]+' |
            ForEach-Object { ($_.Line -replace '^.*\\src\\', 'src\' -replace '\[[^\]]*\.vcxproj\]', '').Trim() } |
            Select-Object -Unique
          Write-Host "$($errors.Count) unique errors"
          $chunks = [System.Collections.Generic.List[string]]::new()
          $chunk = ''
          foreach ($e in $errors) {
            if (($chunk.Length + $e.Length) -gt 3500) { $chunks.Add($chunk); $chunk = '' }
            $chunk += $e + '%0A'
          }
          if ($chunk) { $chunks.Add($chunk) }
          $i = 0
          foreach ($c in ($chunks | Select-Object -First 9)) { $i++; Write-Host "::error title=Compiler errors $i::$c" }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-windows-standalone
          path: standalone/builds/vs17/**/Release/**/*.exe
          if-no-files-found: warn
